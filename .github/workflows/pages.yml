name: Build and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo_failure:
        description: "Release safety demo: remove activity heading from built HTML"
        type: boolean
        required: false
        default: false
  workflow_run:
    workflows: [Update GitHub Activity]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest main, including the activity commit
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate source
        run: python3 scripts/validate_site.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build the README include with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Deliberately break built homepage for release safety demo
        if: github.event_name == 'workflow_dispatch' && inputs.demo_failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_site/index.html')
          html = path.read_text(encoding='utf-8')
          assert 'Latest activity' in html, 'Expected heading before failure injection'
          path.write_text(html.replace('Latest activity', 'DELIBERATE RELEASE SAFETY FAILURE'), encoding='utf-8')
          print('DEMO: removed Latest activity from built HTML; source files are unchanged.')
          PY
          echo '### Deliberate release safety failure' >> "$GITHUB_STEP_SUMMARY"
          echo 'Removed Latest activity from the runner-built HTML. The normal validation gate must reject it before artifact upload or deployment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate generated homepage
        run: python3 scripts/validate_site.py --built _site/index.html
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Record deployed source
        run: |
          echo '### Pages build' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
