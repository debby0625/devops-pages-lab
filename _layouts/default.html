<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header>
      <span class="eyebrow">DEVOPS / GITHUB PAGES</span>
      <p class="intro">Build. Automate. Publish.</p>
    </header>
    <main id="content" tabindex="-1">{{ content }}</main>
    <footer>One README. An automated activity journal. Published with GitHub Pages.</footer>
  </body>
</html>
